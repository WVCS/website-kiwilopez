@charset "utf-8";
/* CSS Document */

body {
    text-align: center;
    background-color: indigo;
}
h1 {
    font-size: 200%;
    color: gold;
    text-align: center;
    text-decoration: wavy 5px gold;
}
img {
    width: 500px; 
    height: auto; 
    border-image-width: fill;
    border: 15px dotted gold;
    border-radius: 50%; 
}
